<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />

    <script type="module" src="app.js"></script>
    <title>STARGRID</title>
  </head>
  <body>
    <div class="arcade-overlay">
      <p class="btn-insert-coin">Insert Coin To Play</p>
    </div>
    <div class="game-starting-screen">
      <button class="btn-game-start">Start Game</button>
    </div>
    <div class="game-frame-center hidden">
      <div class="game-narrator">
        <div class="narrator-img-container">
          <img
            class="narrator-img"
            src="./public/player_narrator.png"
            alt="anime captain woman"
          />
        </div>
        <p class="narrator-message">
          Click a ship to select it, click a map tile to place it, and use the
          Rotate button to change its orientation before placement.
        </p>
      </div>
      <div class="gameboards-container">
        <div class="player-side">
          <h2 class="player-side-title hidden">Friendly Space</h2>
          <div class="gameboard-frame-player">
            <div class="game-x-axis-player"></div>
            <div class="game-y-axis-player"></div>
            <main id="gameboard-player"></main>

            <div class="ship-container">
              <button
                class="ship"
                data-ship-length="5"
                data-ship-type="dreadnought"
                data-ship-direction="X"
              >
                <p class="ship-unit-name">Dreadnought</p>
                <p class="ship-unit-length">▣ ▣ ▣ ▣ ▣</p>
                <div class="ship-unit-container">
                  <img
                    class="ship-unit-sprite"
                    src="./public/dreadnought-spaceship.png"
                    alt="Dreadnought"
                  />
                </div>
              </button>
              <button
                class="ship"
                data-ship-length="4"
                data-ship-type="cruiser"
                data-ship-direction="X"
              >
                <p class="ship-unit-name">Cruiser</p>
                <p class="ship-unit-length">▣ ▣ ▣ ▣</p>
                <div class="ship-unit-container">
                  <img
                    class="ship-unit-sprite"
                    src="./public/cruiser-spaceship.png"
                    alt="Cruiser"
                  />
                </div>
              </button>
              <button
                class="ship"
                data-ship-length="3"
                data-ship-type="destroyer"
                data-ship-direction="X"
              >
                <p class="ship-unit-name">Destroyer</p>
                <p class="ship-unit-length">▣ ▣ ▣</p>
                <div class="ship-unit-container">
                  <img
                    class="ship-unit-sprite"
                    src="./public/destroyer-spaceship.png"
                    alt="Destroyer"
                  />
                </div>
              </button>
              <button
                class="ship"
                data-ship-length="3"
                data-ship-type="frigate"
                data-ship-direction="X"
              >
                <p class="ship-unit-name">Frigate</p>
                <p class="ship-unit-length">▣ ▣ ▣</p>
                <div class="ship-unit-container">
                  <img
                    class="ship-unit-sprite"
                    src="./public/frigate-spaceship.png"
                    alt="Frigate"
                  />
                </div>
              </button>
              <button
                class="ship"
                data-ship-length="2"
                data-ship-type="corvette"
                data-ship-direction="X"
              >
                <p class="ship-unit-name">Corvette</p>
                <p class="ship-unit-length">▣ ▣</p>
                <div class="ship-unit-container">
                  <img
                    class="ship-unit-sprite"
                    src="./public/corvette-spaceship.png"
                    alt="Corvette"
                  />
                </div>
              </button>
            </div>
          </div>
          <div class="player-narrator hidden">
            <div class="narrator-img-container">
              <img
                class="narrator-img"
                src="./public/player_narrator.png"
                alt="anime captain woman"
              />
            </div>
            <p class="player-narrator-message player-narrator-message-battle">
              Here to save the universe!
            </p>
          </div>
        </div>
        <div class="npc-side hidden">
          <h2 class="npc-side-title">Enemy Space</h2>
          <div class="gameboard-frame-npc hidden">
            <div class="game-x-axis-npc"></div>
            <div class="game-y-axis-npc"></div>
            <main id="gameboard-npc"></main>
          </div>
          <div class="npc-narrator hidden">
            <p class="npc-narrator-message npc-narrator-message-battle">
              Muahaha I will destroy your planet.
            </p>
            <div class="narrator-img-container">
              <img
                class="npc-narrator-img"
                src="./public/npc_narrator.png"
                alt="anime captain woman"
              />
            </div>
          </div>
        </div>
      </div>
      <div class="game-menu">
        <button class="btn-reset">
          <span class="material-icons">fast_rewind</span>
          Reset
        </button>
        <button class="btn-start" disabled>
          <span class="material-icons">play_arrow</span>
          Start
        </button>
        <button class="btn-rotate">
          Rotate Ship
          <span class="material-icons btn-rotate-icon">arrow_forward</span>
        </button>
      </div>
    </div>
    <dialog id="dialog">
      <p class="announcement-winner"></p>
      <div class="narrator-img-container">
        <img
          class="narrator-img"
          src="./public/player_narrator.png"
          alt="anime captain woman"
        />
      </div>
      <p class="game-over-message"></p>
      <button class="btn-reset-game" commandfor="dialog" command="close">
        New Battle
      </button>
    </dialog>
  </body>
</html>
