<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
    <title>Battleships</title>
  </head>
  <body>
    <div class="game-frame-center">
      <div class="game-narrator">
        <div>image placeholder</div>
        <p>Hi</p>
      </div>
      <div class="gameboard-frame">
        <div class="game-x-axis">
          <div class="legend-numbers">1</div>
          <div class="legend-numbers">2</div>
        </div>
        <div class="game-y-axis">
          <div class="legend-letters">A</div>
          <div class="legend-letters">B</div>
        </div>
        <main id="gameboard"></main>
        <div class="ship-container">
          <button
            class="ship"
            data-ship-length="5"
            data-ship-type="carrier"
            data-ship-direction="horizontal"
            data-ship-sprite="img placeholder"
          >
            <p>Carrier - 5f</p>
          </button>
          <button
            class="ship"
            data-ship-length="4"
            data-ship-type="battleship"
            data-ship-direction="horizontal"
            data-ship-sprite="img placeholder"
          >
            Battleship - 4f
          </button>
          <button
            class="ship"
            data-ship-length="3"
            data-ship-type="cruiser"
            data-ship-direction="horizontal"
            data-ship-sprite="img placeholder"
          >
            Cruiser - 3f
          </button>
          <button
            class="ship"
            data-ship-length="3"
            data-ship-type="submarine"
            data-ship-direction="horizontal"
            data-ship-sprite="img placeholder"
          >
            Submarine - 3f
          </button>
          <button
            class="ship"
            data-ship-length="2"
            data-ship-type="destroyer"
            data-ship-direction="horizontal"
            data-ship-sprite="img placeholder"
          >
            Destroyer - 2f
          </button>
        </div>
      </div>
      <div class="game-menu">
        <button class="btn-reset">Reset</button>
        <button>Start</button>
        <button class="btn-rotate">Rotate Ship to Y</button>
      </div>
    </div>
  </body>
</html>
