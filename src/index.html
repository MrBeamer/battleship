<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="app.js"></script>
    <title>Battleships</title>
  </head>
  <body>
    <div class="game-frame-center">
      <div class="game-narrator">
        <div class="narrator-img-container">
          <img
            class="narrator-img"
            src="./public/narrator.png"
            alt="anime captain woman"
          />
        </div>
        <p class="narrator-message">
          Click a ship to select it, click a map tile to place it, and use the
          Rotate button to change its orientation before placement.
        </p>
      </div>
      <div class="gameboards-container">
        <div class="gameboard-frame-player">
          <div class="game-x-axis-player"></div>
          <div class="game-y-axis-player"></div>
          <main id="gameboard-player"></main>
          <div class="ship-container">
            <button
              class="ship"
              data-ship-length="5"
              data-ship-type="dreadnought"
              data-ship-direction="horizontal"
              data-ship-sprite="img placeholder"
            >
              <p class="ship-unit-name">Dreadnought</p>
              <div class="ship-unit-container">
                <div class="ship-unit ship-unit-dreadnought"></div>
                <div class="ship-unit ship-unit-dreadnought"></div>
                <div class="ship-unit ship-unit-dreadnought"></div>
                <div class="ship-unit ship-unit-dreadnought"></div>
                <div class="ship-unit ship-unit-dreadnought"></div>
              </div>
            </button>
            <button
              class="ship"
              data-ship-length="4"
              data-ship-type="cruiser"
              data-ship-direction="horizontal"
              data-ship-sprite="img placeholder"
            >
              <p class="ship-unit-name">Cruiser</p>
              <div class="ship-unit-container">
                <div class="ship-unit ship-unit-cruiser"></div>
                <div class="ship-unit ship-unit-cruiser"></div>
                <div class="ship-unit ship-unit-cruiser"></div>
                <div class="ship-unit ship-unit-cruiser"></div>
              </div>
            </button>
            <button
              class="ship"
              data-ship-length="3"
              data-ship-type="destroyer"
              data-ship-direction="horizontal"
              data-ship-sprite="img placeholder"
            >
              <p class="ship-unit-name">Destroyer</p>
              <div class="ship-unit-container">
                <div class="ship-unit ship-unit-destroyer"></div>
                <div class="ship-unit ship-unit-destroyer"></div>
                <div class="ship-unit ship-unit-destroyer"></div>
              </div>
            </button>
            <button
              class="ship"
              data-ship-length="3"
              data-ship-type="frigate"
              data-ship-direction="horizontal"
              data-ship-sprite="img placeholder"
            >
              <p class="ship-unit-name">Frigate</p>
              <div class="ship-unit-container">
                <div class="ship-unit ship-unit-frigate"></div>
                <div class="ship-unit ship-unit-frigate"></div>
                <div class="ship-unit ship-unit-frigate"></div>
              </div>
            </button>
            <button
              class="ship"
              data-ship-length="2"
              data-ship-type="corvette"
              data-ship-direction="horizontal"
              data-ship-sprite="img placeholder"
            >
              <p class="ship-unit-name">Corvette</p>
              <div class="ship-unit-container">
                <div class="ship-unit ship-unit-corvette"></div>
                <div class="ship-unit ship-unit-corvette"></div>
              </div>
            </button>
          </div>
        </div>
        <div class="gameboard-frame-npc hidden">
          <div class="game-x-axis-npc"></div>
          <div class="game-y-axis-npc"></div>
          <main id="gameboard-npc"></main>
        </div>
      </div>
      <div class="game-menu">
        <button class="btn-reset">
          <span>×</span>
          Reset
        </button>
        <button class="btn-start">
          <span>▶</span>
          Start
        </button>
        <button class="btn-rotate">
          <span>↺</span>
          Rotate Ship (Y)
        </button>
      </div>
    </div>
  </body>
</html>
