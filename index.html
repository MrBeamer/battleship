    <div class=arcade-overlay>
      <p class=btn-insert-coin>Insert Coin To Play</p>
    </div>
    <div class=game-starting-screen>
      <button class=btn-game-start>Start Game</button>
    </div>
    <div class="game-frame-center hidden">
      <div class=game-narrator>
        <div class=narrator-img-container>
          <img class=narrator-img src=player_narrator.da162c6b.png alt="anime captain woman">
        </div>
        <p class=narrator-message>
          Click a ship to select it, click a map tile to place it, and use the
          Rotate button to change its orientation before placement.
        </p>
      </div>
      <div class=gameboards-container>
        <div class=player-side>
          <h2 class="hidden player-side-title">Friendly Space</h2>
          <div class=gameboard-frame-player>
            <div class=game-x-axis-player></div>
            <div class=game-y-axis-player></div>
            <main id=gameboard-player></main>

            <div class=ship-container>
              <button class=ship data-ship-length=5 data-ship-type=dreadnought data-ship-direction=X data-ship-sprite="img placeholder">
                <p class=ship-unit-name>Dreadnought</p>
                <div class=ship-unit-container>
                  <div class="ship-unit ship-unit-dreadnought"></div>
                  <div class="ship-unit ship-unit-dreadnought"></div>
                  <div class="ship-unit ship-unit-dreadnought"></div>
                  <div class="ship-unit ship-unit-dreadnought"></div>
                  <div class="ship-unit ship-unit-dreadnought"></div>
                </div>
              </button>
              <button class=ship data-ship-length=4 data-ship-type=cruiser data-ship-direction=X data-ship-sprite="img placeholder">
                <p class=ship-unit-name>Cruiser</p>
                <div class=ship-unit-container>
                  <div class="ship-unit ship-unit-cruiser"></div>
                  <div class="ship-unit ship-unit-cruiser"></div>
                  <div class="ship-unit ship-unit-cruiser"></div>
                  <div class="ship-unit ship-unit-cruiser"></div>
                </div>
              </button>
              <button class=ship data-ship-length=3 data-ship-type=destroyer data-ship-direction=X data-ship-sprite="img placeholder">
                <p class=ship-unit-name>Destroyer</p>
                <div class=ship-unit-container>
                  <div class="ship-unit ship-unit-destroyer"></div>
                  <div class="ship-unit ship-unit-destroyer"></div>
                  <div class="ship-unit ship-unit-destroyer"></div>
                </div>
              </button>
              <button class=ship data-ship-length=3 data-ship-type=frigate data-ship-direction=X data-ship-sprite="img placeholder">
                <p class=ship-unit-name>Frigate</p>
                <div class=ship-unit-container>
                  <div class="ship-unit ship-unit-frigate"></div>
                  <div class="ship-unit ship-unit-frigate"></div>
                  <div class="ship-unit ship-unit-frigate"></div>
                </div>
              </button>
              <button class=ship data-ship-length=2 data-ship-type=corvette data-ship-direction=X data-ship-sprite="img placeholder">
                <p class=ship-unit-name>Corvette</p>
                <div class=ship-unit-container>
                  <div class="ship-unit ship-unit-corvette"></div>
                  <div class="ship-unit ship-unit-corvette"></div>
                </div>
              </button>
            </div>
          </div>
          <div class="hidden player-narrator">
            <div class=narrator-img-container>
              <img class=narrator-img src=player_narrator.da162c6b.png alt="anime captain woman">
            </div>
            <p class="player-narrator-message player-narrator-message-battle">
              Here to save the universe!
            </p>
          </div>
        </div>
        <div class="hidden npc-side">
          <h2 class=npc-side-title>Enemy Space</h2>
          <div class="gameboard-frame-npc hidden">
            <div class=game-x-axis-npc></div>
            <div class=game-y-axis-npc></div>
            <main id=gameboard-npc></main>
          </div>
          <div class="hidden npc-narrator">
            <p class="npc-narrator-message npc-narrator-message-battle">
              Muahaha I will destroy your planet.
            </p>
            <div class=narrator-img-container>
              <img class=npc-narrator-img src=npc_narrator.4b0ecfcd.png alt="anime captain woman">
            </div>
          </div>
        </div>
      </div>
      <div class=game-menu>
        <button class=btn-reset>
          <span class=material-icons>fast_rewind</span>
          Reset
        </button>
        <button class=btn-start>
          <span class=material-icons>play_arrow</span>
          Start
        </button>
        <button class=btn-rotate>
          <span class=material-icons>rotate_left</span>
          Rotate Ship
        </button>
      </div>
    </div>
    <dialog id=dialog>
      <p class=announcement-winner></p>
      <div class=narrator-img-container>
        <img class=narrator-img src=player_narrator.da162c6b.png alt="anime captain woman">
      </div>
      <p class=game-over-message></p>
      <button class=btn-reset-game commandfor=dialog command=close>
        New Battle
      </button>
    </dialog>
